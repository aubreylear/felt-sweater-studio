<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sweater Endeavor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Protest+Riot&family=Graduate&family=Rampart+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Sweater Endeavor</h1>
</header>
<main>
  <div class="stage-wrap">
    <div id="stage" aria-label="Sweater preview"></div>
    <button id="undo" class="btn" title="Shortcut: Ctrl/Cmd + Z" disabled>↩ Undo</button>
    <span id="sideTag" class="side-tag" aria-live="polite">Front</span>
    <div id="printout"></div>
    <div class="actions">
      <button id="rand" class="btn primary" title="Shortcut: R">🎲 Surprise me</button>
      <button id="flip" class="btn" title="Shortcut: F">🔄 Turn over</button>
      <div class="seg" role="group" aria-label="View">
        <button data-mode="felt">Full color</button>
        <button data-mode="outline">Coloring page</button>
      </div>
      <button id="dl" class="btn">Download PNG</button>
      <button id="print" class="btn">Print</button>
    </div>
    <p class="hint">Download and Print show the front and back together. Full color downloads have a transparent background; coloring pages are white.</p>
  </div>
  <aside id="panel"></aside>
  <section id="tray" class="tray" aria-label="Shapes"></section>
  <section id="letters" class="tray" aria-label="Letters"></section>
  <section id="garlands" class="tray" aria-label="Garland"></section>
</main>
<script src="app.js"></script>
</body>
</html>
